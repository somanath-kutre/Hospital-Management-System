{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card shadow-sm">
    <div class="card-header fw-semibold">{{ title }}</div>
    <form method="post" class="card-body">{% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <button class="btn btn-primary">{{ submit|default:'Save' }}</button>
      <a class="btn btn-link" href="{{ cancel_url|default:'/' }}">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
