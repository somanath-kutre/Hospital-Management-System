{% extends 'base.html' %}
{% block title %}Patient registration{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card shadow-sm"><div class="card-header fw-semibold">Patient registration</div>
    <form method="post" class="card-body">{% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <button class="btn btn-primary">Create account</button>
      <a class="btn btn-link" href="{% url 'login' %}">Back to login</a>
    </form>
  </div>
</div></div>
{% endblock %}
